<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@300;400;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&display=swap');

    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Anek Malayalam', sans-serif;
      font-size: 11px;
      color: #1a2520;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      height: 297mm;
      padding: 8mm;
      background: #FDFDF9;
      position: relative;
      overflow: hidden;
    }

    @media screen {
      body { background: #2a2a2a; display: flex; justify-content: center; padding: 40px; }
      .page { box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); }
    }

    /* ── BORDERS ── */
    .frame-outer { width: 100%; height: 100%; border: 1px solid #D4AF37; padding: 3px; }
    .frame-middle { width: 100%; height: 100%; border: 8px solid #0F3A22; padding: 3px; }
    .frame-inner {
      width: 100%; height: 100%; border: 1px solid #D4AF37; padding: 12mm;
      position: relative; background: #FDFDF9; display: flex; flex-direction: column;
    }
    .content-wrapper { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; }

    /* Corner Ornaments */
    .corner { position: absolute; width: 40px; height: 40px; border: 3px solid #D4AF37; z-index: 1; background: #FDFDF9; }
    .c-tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .c-tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
    .c-bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
    .c-br { bottom: -3px; right: -3px; border-left: none; border-top: none; }

    /* ── HEADER ── */
    .header { text-align: center; margin-bottom: 20px; }
    .bismillah { font-size: 28px; color: #0F3A22; margin-bottom: 8px; line-height: 1; }
    .org-name { font-size: 24px; font-weight: 800; color: #0F3A22; letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase; }
    .org-sub { font-size: 11px; color: #8B7330; font-weight: 600; letter-spacing: 0.5px; }

    /* ── DIVIDER ── */
    .divider { display: flex; align-items: center; justify-content: center; margin: 12px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, transparent, #D4AF37, transparent); }
    .divider-icon { margin: 0 15px; color: #0F3A22; font-size: 16px; line-height: 1; }

    /* ── TITLE ── */
    .title-area { text-align: center; margin: 15px 0 20px; }
    .title-arabic { font-family: 'Noto Naskh Arabic', serif; font-size: 22px; color: #D4AF37; margin-bottom: 6px; }
    .title-main {
      font-size: 26px; font-weight: 800; color: #0F3A22; display: inline-block;
      padding: 0 24px 6px; border-bottom: 2px solid #D4AF37; letter-spacing: 1px;
    }

    /* ── META ── */
    .meta-bar {
      display: flex; justify-content: space-between; padding: 8px 25px;
      background: rgba(15, 58, 34, 0.04); border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 4px; font-size: 12px; font-weight: 700; color: #0F3A22; margin-bottom: 28px;
    }
    .meta-bar span { font-weight: 600; color: #1a2520; margin-left: 5px; }

    /* ── BODY ── */
    .cert-body {
      font-size: 15px; line-height: 2.1; color: #2c3e50;
      text-align: center; white-space: pre-line; padding: 0 12px; margin-bottom: 30px;
    }

    /* ── SIGNATURES ── */
    .signatures { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding: 0 15px 20px; }
    .sig-block { text-align: center; width: 180px; }
    .sig-line { border-top: 1.5px solid #0F3A22; margin-bottom: 6px; }
    .sig-role { font-size: 11px; font-weight: 700; color: #0F3A22; }
    .sig-name { font-size: 10px; color: #666; margin-top: 3px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame-outer">
      <div class="frame-middle">
        <div class="frame-inner">
          <div class="c-tl corner"></div>
          <div class="c-tr corner"></div>
          <div class="c-bl corner"></div>
          <div class="c-br corner"></div>

          <div class="content-wrapper">
            <!-- HEADER -->
            <div class="header">
              <div class="bismillah">﷽</div>
              <div class="org-name">{{mahallu_name_malayalam}}</div>
              <div class="org-sub">{{mahallu_address}} &bull; റെജി. നമ്പർ: {{mahallu_reg_no}}</div>
            </div>

            <div class="divider"><span class="divider-icon">✦</span></div>

            <!-- TITLE -->
            <div class="title-area">
              <div class="title-main">{{title}}</div>
            </div>

            <div class="divider"><span class="divider-icon">✦</span></div>

            <!-- META -->
            <div class="meta-bar">
              <div>നം: <span>{{certificate_no}}</span></div>
              <div>തിയതി: <span>{{date}}</span></div>
            </div>

            <!-- BODY -->
            <div class="cert-body">{{body}}</div>

            <!-- SIGNATURES -->
            <div class="signatures">
              <div class="sig-block">
                <div class="sig-line"></div>
                <div class="sig-role">പ്രസിഡന്റ്</div>
                <div class="sig-name">{{mahallu_name_malayalam}}</div>
              </div>
              <div class="sig-block">
                <div class="sig-line"></div>
                <div class="sig-role">സെക്രട്ടറി</div>
                <div class="sig-name">{{mahallu_name_malayalam}}</div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
